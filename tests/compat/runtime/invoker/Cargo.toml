[package]
name = "compat-invoker"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "compat-invoker"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "27", features = ["component-model"] }
wasmtime-wasi = "27"
wasmtime-wasi-http = "27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 1
