[package]
name = "compat-invoker"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "compat-invoker"
path = "src/main.rs"

[dependencies]
# NOTE: this repository itself pins Wasmtime v42.0.1 (cmake/wasmtime.cmake,
# build.zig.zon). These pins now match it exactly. The published `wasmtime`
# 42.0.1 crate requires rustc >= 1.91.0 (edition 2024), which is newer than
# this repository's rust-toolchain.toml (rustc 1.88.0, pinned for producing
# production wasm32-wasip1 artifacts). That is not a blocker for *this*
# crate: compat-invoker is a standalone host-side test tool that produces
# no wasm32-wasip1 output and is never linked into StarlingMonkey itself,
# so it carries its own scoped `rust-toolchain.toml` (in this directory)
# pinning exact Rust 1.91.0, independently of the repository root's pin.
# See ../README.md's "Wasmtime version" section for details.
wasmtime = { version = "=42.0.1", features = ["component-model", "anyhow"] }
wasmtime-wasi = "=42.0.1"
wasmtime-wasi-http = "=42.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
# Only used by the #[cfg(test)] unit tests in src/main.rs to compile small
# hand-written component WAT text fixtures (e.g. a post-return that traps)
# without needing a real StarlingMonkey/JS component.
wat = "1"

[profile.release]
opt-level = 1
