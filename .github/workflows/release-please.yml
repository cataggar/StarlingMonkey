name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # StarlingMonkey outputs
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Debugger Extension outputs
      debugger_release_created: ${{ steps.release.outputs['debugger/vscode-dap-extension--release_created'] }}
      debugger_tag_name: ${{ steps.release.outputs['debugger/vscode-dap-extension--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 #v4.2.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        rust-version: ['1.80.0']
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache-release
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Just
        uses: taiki-e/install-action@just

      - name: Validate workflow recipes
        run: python3 tests/workflows/check-just-recipes.py .github/workflows/release-please.yml justfile


      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.902+7255f3e72

      - name: Install Rust ${{ matrix.rust-version }}
        run: |
          rustup toolchain install ${{ matrix.rust-version }}
          rustup target add wasm32-wasip1 --toolchain ${{ matrix.rust-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: 'lts/*'

      - name: Build All Variants
        run: |
          just mode=release builddir=build-release build starling
          just mode=relwithdebinfo builddir=build-debug build starling
          ./deps/build-deps.sh --all
          just builddir=build-aot aot-build

      - name: Validate CMake host API release matrix
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache-release-surface
        run: |
          zig build host-api-cmake-production-matrix-test \
            -Doptimize=ReleaseSmall

      - name: Prepare Artifacts
        run: |
          mkdir -p release-artifacts

          # Core-module versions of the runtime
          cp build-release/starling-raw.wasm release-artifacts/starling-raw.wasm
          cp build-debug/starling-raw.wasm release-artifacts/starling-raw-debug.wasm

          # Component-versions of the runtime
          cp build-release/starling.wasm release-artifacts/starling.wasm
          cp build-debug/starling.wasm release-artifacts/starling-debug.wasm

          # Supporting artifacts
          cp build-release/preview1-adapter.wasm release-artifacts

          expected="$(
            printf '%s\n' \
              preview1-adapter.wasm \
              starling-debug.wasm \
              starling-raw-debug.wasm \
              starling-raw.wasm \
              starling.wasm
          )"
          actual="$(
            find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort
          )"
          if [ "$actual" != "$expected" ]; then
            echo "unexpected release inventory" >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          just builddir=build-aot aot-package release-artifacts
          ./scripts/check-release-artifacts.sh release-artifacts

          echo "Release artifacts:"
          ls -la release-artifacts/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 #2.3.2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release-artifacts/*

  publish-extension:
    needs: release-please
    if: ${{ needs.release-please.outputs.debugger_release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        working-directory: debugger/vscode-dap-extension
        run: npm ci

      - name: Build extension
        working-directory: debugger/vscode-dap-extension
        run: npm run build

      - name: Package extension
        working-directory: debugger/vscode-dap-extension
        run: npm run package

      - name: Publish to VS Code Marketplace
        working-directory: debugger/vscode-dap-extension
        run: npm run publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX to Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 #2.3.2
        with:
          tag_name: ${{ needs.release-please.outputs.debugger_tag_name }}
          files: debugger/vscode-dap-extension/*.vsix
          make_latest: false
